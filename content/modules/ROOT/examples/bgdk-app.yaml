apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgdk-app
spec:
  destination:
    namespace: test-bgdk
    server: https://kubernetes.default.svc
  project: default
  source:
    path: content/modules/ROOT/examples/bgdk
    repoURL: https://github.com/adregis/openshift-gitops-workshop
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
